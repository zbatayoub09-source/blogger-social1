name: Blogger product publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare OAuth token
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          test -n "$BLOGGER_TOKEN_JSON" || (echo "Missing BLOGGER_TOKEN_JSON secret" && exit 1)
          printf '%s' "$BLOGGER_TOKEN_JSON" > token.json
          chmod 600 token.json
      - name: Publish up to five products
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          MAX_PER_RUN: "5"
          DELAY_SECONDS: "15"
        run: python blogger_publish.py
      - name: Remove temporary credentials
        if: always()
        run: rm -f token.json
